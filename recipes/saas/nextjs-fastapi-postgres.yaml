kind: recipe
id: nextjs-fastapi-postgres
version: 1.0.0
name: Next.js + FastAPI + PostgreSQL
description: Full-stack SaaS with Python FastAPI backend and Next.js dashboard frontend

workspaces:
  - id: web
    path: apps/web
    pack: web/nextjs-saas-dashboard
    deployTarget: vercel

  - id: api
    path: apps/api
    pack: api/fastapi
    deployTarget: railway

adapters:
  - id: next_to_fastapi
    args:
      webId: web
      apiId: api

installers:
  - action: envSeed
    args: { profile: dev }
