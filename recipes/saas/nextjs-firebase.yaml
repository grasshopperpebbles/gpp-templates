kind: recipe
id: nextjs-firebase
version: 1.0.0
name: Next.js + Firebase
description: Full-stack SaaS with Firebase (Firestore + Auth + Storage) and Next.js dashboard frontend

workspaces:
  - id: web
    path: apps/web
    pack: web/nextjs-saas-dashboard
    deployTarget: vercel

adapters:
  - id: next_to_firebase
    args:
      webId: web

installers:
  - action: envSeed
    args: { profile: dev }
  - action: nodeInstall
    args: { workspaces: [web], packageManager: npm }
