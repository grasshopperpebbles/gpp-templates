kind: recipe
id: flutter-fastapi
version: 1.0.0
name: Flutter + FastAPI
description: Cross-platform mobile app with Python FastAPI backend

workspaces:
  - id: mobile
    path: apps/mobile
    pack: mobile/flutter-api-client
    deployTarget: app-store

  - id: api
    path: apps/api
    pack: api/fastapi
    deployTarget: railway

  - id: web
    path: apps/web
    pack: web/nextjs-app-landing
    deployTarget: vercel
    description: Marketing landing page for your mobile app

adapters:
  - id: flutter-to-fastapi
    args:
      mobileId: mobile
      apiId: api

installers:
  - action: envSeed
    args: { profile: dev }
