kind: recipe
id: flutter-firebase
version: 1.0.0
name: Flutter + Firebase
description: Cross-platform mobile app with Firebase backend services

workspaces:
  - id: mobile
    path: apps/mobile
    pack: mobile/flutter-standalone
    deployTarget: app-store

  - id: web
    path: apps/web
    pack: web/nextjs-app-landing
    deployTarget: vercel
    description: Marketing landing page for your mobile app

installers:
  - action: envSeed
    args: { profile: dev }
