kind: recipe
id: nextjs-strapi
version: 1.0.0
name: Next.js + Strapi
description: Modern headless CMS with Strapi backend and Next.js frontend

workspaces:
  - id: web
    path: apps/web
    pack: web/nextjs-headless-strapi
    deployTarget: vercel

  - id: cms
    path: apps/cms
    pack: cms/strapi-dev
    deployTarget: railway

adapters:
  - id: nextjs-to-strapi
    args:
      webId: web
      cmsId: cms

installers:
  - action: envSeed
    args: { profile: dev }
