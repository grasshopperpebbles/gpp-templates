kind: recipe
id: sveltekit-sanity
version: 1.0.0
name: SvelteKit + Sanity
description: Real-time collaborative CMS with Sanity.io and SvelteKit frontend

workspaces:
  - id: web
    path: apps/web
    pack: web/sveltekit-headless-sanity
    deployTarget: vercel

  - id: cms
    path: apps/cms
    pack: cms/sanity-dev
    deployTarget: vercel

adapters:
  - id: sveltekit_to_sanity
    args:
      webId: web
      cmsId: cms

installers:
  - action: envSeed
    args: { profile: dev }

