services:
  {{PROJECT_SLUG}}-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: {{PROJECT_SLUG}}-api
    ports:
      - "8080:8080"
    environment:
      - SERVER_ADDR=:8080
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

