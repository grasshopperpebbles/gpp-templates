[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Warnings fail the run, except known ones from pinned third-party deps.
filterwarnings =
    error
    ignore:'crypt' is deprecated:DeprecationWarning:passlib.utils
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning:jose
