[project.dependencies]
fastapi = ">=0.110"
uvicorn = { extras = ["standard"], version = ">=0.27" }
pydantic = ">=2.6"
pydantic-settings = ">=2.2"
SQLAlchemy = ">=2.0"
alembic = ">=1.13"
psycopg = { extras = ["binary"], version = ">=3.1" }
python-jose = { extras = ["cryptography"], version = ">=3.3" }
passlib = { extras = ["bcrypt"], version = ">=1.7" }
python-multipart = ">=0.0.9"
email-validator = "^2.1"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
]
graphql = [
  "strawberry-graphql[fastapi]>=0.220",
]
ai = [
  "anthropic>=0.18",
  "openai>=1.0",
]
trends = [
  "pytrends>=4.9",
  "praw>=7.7",
]
payments = [
  "stripe>=8.0",
]
cache = [
  "redis>=5.0",
]
all = [
  "anthropic>=0.18",
  "openai>=1.0",
  "pytrends>=4.9",
  "praw>=7.7",
  "stripe>=8.0",
  "strawberry-graphql[fastapi]>=0.220",
  "redis>=5.0",
]
