[package]
name = "worker"
version = "0.1.0"
edition = "2021"
authors = ["GPP Project"]
description = "Background worker built with Tokio"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
dotenvy = "0.15"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Time & scheduling
chrono = { version = "0.4", features = ["serde"] }
tokio-cron-scheduler = "0.10"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# HTTP client (for health checks or API calls)
reqwest = { version = "0.11", features = ["json"] }

# Lightweight HTTP server for health checks
axum = "0.7"
tower = "0.4"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
