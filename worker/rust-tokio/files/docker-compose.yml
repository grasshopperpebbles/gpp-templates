version: '3.8'

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"  # Health check endpoint
    environment:
      - ENVIRONMENT=development
      - HEALTH_PORT=8080
      - WORKER_CONCURRENCY=4
      - POLL_INTERVAL_SECS=5
      - RUST_LOG=debug
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

