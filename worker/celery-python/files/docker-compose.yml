services:
  # Redis broker
  {{PROJECT_SLUG}}-redis:
    image: redis:7-alpine
    container_name: {{PROJECT_SLUG}}-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Celery worker
  {{PROJECT_SLUG}}-worker:
    build: .
    container_name: {{PROJECT_SLUG}}-worker
    env_file:
      - .env
    depends_on:
      {{PROJECT_SLUG}}-redis:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info
    # ===== OPTIONAL: Development volume mounts =====
    # Uncomment for hot-reload during development.
    # IMPORTANT: Volume changes require container recreation:
    #   docker compose down && docker compose up -d
    #
    # volumes:
    #   - ./app:/app/app:ro
    restart: unless-stopped

  # Celery Beat scheduler (for periodic tasks)
  # Uncomment if you need scheduled tasks
  # {{PROJECT_SLUG}}-beat:
  #   build: .
  #   container_name: {{PROJECT_SLUG}}-beat
  #   env_file:
  #     - .env
  #   depends_on:
  #     {{PROJECT_SLUG}}-redis:
  #       condition: service_healthy
  #   command: celery -A app.celery_app beat --loglevel=info
  #   restart: unless-stopped

  # Flower monitoring (optional)
  # Uncomment to enable web-based task monitoring at http://localhost:5555
  # {{PROJECT_SLUG}}-flower:
  #   build: .
  #   container_name: {{PROJECT_SLUG}}-flower
  #   env_file:
  #     - .env
  #   depends_on:
  #     {{PROJECT_SLUG}}-redis:
  #       condition: service_healthy
  #   command: celery -A app.celery_app flower --port=5555
  #   ports:
  #     - "5555:5555"
  #   restart: unless-stopped

volumes:
  redis_data:
