#===============================================================================
# STRAPI DEVELOPMENT - DOCKER COMPOSE
#===============================================================================
# This file uses environment variables from .env
# Run: docker compose --env-file .env up -d
#===============================================================================

# Fixed project name prevents volume name changes when directory is renamed
# This ensures database volumes persist across directory renames
name: ${PROJECT_SLUG:-strapi-dev}

services:
  db:
    image: mysql:8.0
    container_name: ${PROJECT_SLUG:-strapi-dev}-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-strapi_dev}
      MYSQL_USER: ${MYSQL_USER:-strapi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-strapi}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - strapi-dev-network
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    command: --default-authentication-plugin=mysql_native_password

  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PROJECT_SLUG:-strapi-dev}:latest
    container_name: ${PROJECT_SLUG:-strapi-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
    environment:
      # Database
      DATABASE_CLIENT: mysql
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-strapi_dev}
      DATABASE_USERNAME: ${MYSQL_USER:-strapi}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-strapi}
      DATABASE_SSL: false

      # App
      APP_NAME: ${SITE_NAME:-Strapi Dev}
      APP_ENV: development
      APP_KEY: ${STRAPI_APP_KEY:-}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:-}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:-}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:-}
      JWT_SECRET: ${STRAPI_JWT_SECRET:-}

      # Server
      HOST: 0.0.0.0
      PORT: 1337
      URL: ${STRAPI_URL:-http://localhost:1338}

      # Admin
      ADMIN_URL: ${STRAPI_ADMIN_URL:-/admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}

      # CORS
      CORS_ENABLED: true
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:3001}

      # Timezone
      TZ: ${TIMEZONE:-America/New_York}
    volumes:
      - strapi_data:/opt/app
      - ./src:/opt/app/src
      - ./config:/opt/app/config
      - ./database:/opt/app/database
      - ./public:/opt/app/public
    ports:
      - "${STRAPI_PORT:-1338}:1337"
    networks:
      - strapi-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1337/_health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  phpmyadmin:
    image: phpmyadmin:5
    container_name: ${PROJECT_SLUG:-strapi-dev}-phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 100M
    ports:
      - "${PHPMYADMIN_PORT:-9092}:80"
    networks:
      - strapi-dev-network

volumes:
  db_data:
  strapi_data:

networks:
  strapi-dev-network:
    driver: bridge

