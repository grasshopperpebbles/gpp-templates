#===============================================================================
# HEADLESS WORDPRESS STARTER - DOCKER COMPOSE
#===============================================================================
# Service keys use {{GPP_APP_KEY_PREFIX}} so `gpp verify` passes (Docker Desktop
# shows the service key). Substituted on recipe apply.
# Run: cp .env.example .env && docker compose up -d
#===============================================================================

services:
  {{GPP_APP_KEY_PREFIX}}-db:
    image: mariadb:11
    container_name: ${PROJECT_SLUG}-mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wp}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    ports:
      - "${MYSQL_PORT:-3307}:3306"

  {{GPP_APP_KEY_PREFIX}}-wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PROJECT_SLUG}-wordpress:latest
    container_name: ${PROJECT_SLUG}-wordpress
    restart: unless-stopped
    depends_on:
      {{GPP_APP_KEY_PREFIX}}-db:
        condition: service_started
      {{GPP_APP_KEY_PREFIX}}-redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    environment:
      # Database (hostname = compose service name)
      WORDPRESS_DB_HOST: {{GPP_APP_KEY_PREFIX}}-db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wp}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      REDIS_HOST: ${REDIS_HOST:-{{GPP_APP_KEY_PREFIX}}-redis}

      # Pass through to install-plugins.sh
      SITE_NAME: ${SITE_NAME:-My Store}
      SITE_TAGLINE: ${SITE_TAGLINE:-Your one-stop shop}
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      TIMEZONE: ${TIMEZONE:-America/New_York}
      STORE_ADDRESS: ${STORE_ADDRESS:-123 Main Street}
      STORE_ADDRESS_2: ${STORE_ADDRESS_2:-}
      STORE_CITY: ${STORE_CITY:-New York}
      STORE_STATE: ${STORE_STATE:-NY}
      STORE_POSTCODE: ${STORE_POSTCODE:-10001}
      STORE_COUNTRY: ${STORE_COUNTRY:-US}
      STORE_CURRENCY: ${STORE_CURRENCY:-USD}
      ENABLE_WOOCOMMERCE: ${ENABLE_WOOCOMMERCE:-true}
      ENABLE_TAXES: ${ENABLE_TAXES:-false}
      ENABLE_SHIPPING: ${ENABLE_SHIPPING:-true}

      # WordPress Config Extra
      WORDPRESS_CONFIG_EXTRA: |
        /* Debug Settings */
        define('WP_DEBUG', ${WP_DEBUG:-true});
        define('WP_DEBUG_LOG', ${WP_DEBUG_LOG:-true});
        define('WP_DEBUG_DISPLAY', ${WP_DEBUG_DISPLAY:-false});
        define('WP_MEMORY_LIMIT', '${PHP_MEMORY_LIMIT:-512M}');
        define('WP_MAX_MEMORY_LIMIT', '${PHP_MEMORY_LIMIT:-512M}');

        /* GraphQL CORS */
        define('GRAPHQL_CORS_ENABLE', true);

        /* JWT Authentication */
        define('JWT_AUTH_SECRET_KEY', '${JWT_SECRET_KEY:-local-dev-secret-key-change-in-production}');
        define('JWT_AUTH_CORS_ENABLE', true);

        /* Headless Mode - Frontend URL for CORS */
        define('HEADLESS_MODE_CLIENT_URL', '${FRONTEND_URL:-http://localhost:3000}');

        /* WooCommerce */
        define('WC_ABSPATH', ABSPATH . 'wp-content/plugins/woocommerce/');

        /* Redis Object Cache */
        define('WP_REDIS_HOST', '${REDIS_HOST:-{{GPP_APP_KEY_PREFIX}}-redis}');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_DATABASE', ${REDIS_DATABASE:-0});
        define('WP_REDIS_TIMEOUT', 1);
        define('WP_REDIS_READ_TIMEOUT', 1);

        /* Disable file editing */
        define('DISALLOW_FILE_EDIT', false);
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./install-plugins.sh:/usr/local/bin/install-plugins.sh
    ports:
      - "${WP_PORT:-8081}:80"
    networks:
      - app-network

  {{GPP_APP_KEY_PREFIX}}-phpmyadmin:
    image: phpmyadmin:5
    container_name: ${PROJECT_SLUG}-phpmyadmin
    restart: unless-stopped
    depends_on:
      - {{GPP_APP_KEY_PREFIX}}-db
    environment:
      PMA_HOST: {{GPP_APP_KEY_PREFIX}}-db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 100M
    ports:
      - "${PHPMYADMIN_PORT:-9091}:80"
    networks:
      - app-network

  {{GPP_APP_KEY_PREFIX}}-redis:
    image: redis:7-alpine
    container_name: ${PROJECT_SLUG}-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks:
      - app-network

volumes:
  db_data:
  wordpress_data:
  redis_data:

networks:
  app-network:
    driver: bridge
